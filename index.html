<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f6f7f9" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Etkinlik Takip Programı</title>
  <style>
    :root{
      --bg:#f5f6f8;
      --panel:#ffffff;
      --panel-2:#f0f2f5;
      --text:#17202a;
      --muted:#6b7280;
      --line:#e3e6ea;
      --primary:#1f6feb;
      --primary-pressed:#1959bc;
      --success:#16835d;
      --warning:#b66b00;
      --danger:#c93737;
      --shadow:0 10px 30px rgba(20,30,50,.08);
      --radius:18px;
      --radius-sm:12px;
      --tap:54px;
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,Roboto,"Segoe UI",Arial,sans-serif}
    body{padding-bottom:max(22px,env(safe-area-inset-bottom))}
    button,input,select,textarea{font:inherit}
    button{cursor:pointer}
    .app-shell{max-width:980px;margin:0 auto;padding:18px 16px 34px}
    .topbar{position:sticky;top:0;z-index:20;background:rgba(245,246,248,.94);backdrop-filter:blur(14px);padding:calc(10px + env(safe-area-inset-top)) 0 12px;margin-bottom:8px}
    .topbar-inner{display:flex;align-items:center;gap:12px}
    .brand{flex:1;min-width:0}
    .brand h1{font-size:clamp(21px,5vw,30px);line-height:1.1;margin:0;font-weight:800;letter-spacing:-.02em}
    .brand-meta{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:13px;color:var(--muted)}
    .status-dot{width:9px;height:9px;border-radius:50%;background:#a7adb5;display:inline-block}
    .status-dot.online{background:var(--success)}
    .status-dot.offline{background:var(--danger)}
    .icon-btn{width:var(--tap);height:var(--tap);border:1px solid var(--line);background:var(--panel);border-radius:16px;display:grid;place-items:center;box-shadow:0 3px 12px rgba(20,30,50,.04);color:var(--text)}
    .icon-btn svg{width:23px;height:23px}
    .view{display:none}.view.active{display:block}
    .hero{display:flex;gap:14px;align-items:center;justify-content:flex-end;margin:14px 0 20px}.hero-compact .primary-btn{min-width:190px}
    .primary-btn,.secondary-btn,.danger-btn,.ghost-btn{min-height:var(--tap);border-radius:15px;padding:0 18px;border:0;font-weight:750;display:inline-flex;align-items:center;justify-content:center;gap:8px}
    .primary-btn{background:var(--primary);color:#fff;box-shadow:0 8px 18px rgba(31,111,235,.18)}
    .primary-btn:active{background:var(--primary-pressed)}
    .secondary-btn{background:var(--panel);color:var(--text);border:1px solid var(--line)}
    .danger-btn{background:#fff2f2;color:var(--danger);border:1px solid #ffd6d6}
    .ghost-btn{background:transparent;color:var(--primary);min-height:44px;padding:0 12px}
    .full{width:100%}
    .section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:20px 2px 12px}
    .section-head h2{margin:0;font-size:19px}.section-head .sub{color:var(--muted);font-size:13px}
    .event-list{display:grid;gap:12px}
    .event-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:0 5px 18px rgba(20,30,50,.04);display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
    .event-card:active{transform:scale(.995)}
    .event-title{font-size:18px;font-weight:800;margin-bottom:8px;line-height:1.25}
    .event-meta{display:flex;flex-wrap:wrap;gap:7px;color:var(--muted);font-size:13px}
    .pill{display:inline-flex;align-items:center;gap:5px;padding:6px 9px;border-radius:999px;background:var(--panel-2);font-size:12px;font-weight:700;color:#4b5563}
    .event-arrow{font-size:27px;color:#9aa1aa;padding-left:8px}
    .empty{background:var(--panel);border:1px dashed #ccd2d8;border-radius:18px;padding:28px 18px;text-align:center;color:var(--muted)}
    .empty strong{display:block;color:var(--text);font-size:18px;margin-bottom:6px}
    .detail-head{display:flex;gap:10px;align-items:flex-start;margin:8px 0 14px}
    .back-btn{width:48px;height:48px;border:1px solid var(--line);border-radius:14px;background:var(--panel);font-size:25px}
    .detail-title-wrap{flex:1;min-width:0}.detail-title-wrap h2{margin:2px 0 7px;font-size:23px;line-height:1.2}.detail-title-wrap .event-meta{font-size:13px}
    .detail-menu{display:flex;gap:8px}
    .stats-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:14px 0}
    .stat{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:14px;min-height:95px}
    .stat-label{font-size:12px;color:var(--muted);font-weight:700;line-height:1.3}.stat-value{font-size:27px;font-weight:850;margin-top:6px;letter-spacing:-.03em}.stat-value.small{font-size:20px}
    .toolbar{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:12px;margin:15px 0;display:grid;gap:10px}
    .search-row{display:grid;grid-template-columns:1fr 150px;gap:9px}
    .field,.select{width:100%;min-height:50px;border:1px solid #d8dde3;border-radius:13px;background:#fff;padding:0 13px;color:var(--text);outline:none}
    .field:focus,.select:focus{border-color:#8bb6f6;box-shadow:0 0 0 3px rgba(31,111,235,.1)}
    .filter-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
    .member-list{display:grid;gap:10px}
    .member-card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:0 4px 14px rgba(20,30,50,.035)}
    .member-top{display:flex;align-items:flex-start;gap:10px}.member-main{flex:1;min-width:0}.member-name{font-weight:850;font-size:17px;line-height:1.25;word-break:break-word}.member-class{font-size:13px;color:var(--muted);margin-top:4px}
    .member-statuses{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}.status-badge{padding:7px 9px;border-radius:10px;font-size:12px;font-weight:800}.paid{background:#e9f8f1;color:#0f7653}.partial{background:#fff5df;color:#9a5b00}.unpaid{background:#ffeded;color:#a72d2d}.permission-ok{background:#edf6ff;color:#1d62a8}.permission-missing{background:#f2f3f5;color:#626a73}
    .member-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}.member-actions button{min-height:46px;border-radius:12px;font-weight:800;border:1px solid var(--line);background:#fff}.member-actions .pay{background:#eef5ff;color:#195da8;border-color:#d2e4ff}.member-actions .permit{background:#edf9f4;color:#0e7651;border-color:#cfeee2}
    .fabbar{position:sticky;bottom:0;z-index:15;background:linear-gradient(to top,var(--bg) 72%,rgba(245,246,248,0));padding:16px 0 max(8px,env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr 1fr;gap:9px}
    .modal-backdrop{position:fixed;inset:0;background:rgba(17,24,39,.46);z-index:100;display:none;align-items:flex-end;justify-content:center;padding:0}
    .modal-backdrop.open{display:flex}
    .modal{width:min(100%,760px);max-height:92vh;background:var(--panel);border-radius:24px 24px 0 0;box-shadow:0 -20px 50px rgba(0,0,0,.18);overflow:hidden;display:flex;flex-direction:column}
    .modal-head{padding:17px 18px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}.modal-head h3{margin:0;flex:1;font-size:20px}.modal-close{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:24px}
    .modal-body{padding:16px 18px;overflow:auto}.modal-foot{padding:12px 18px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1.4fr;gap:9px;background:#fff}
    .form-grid{display:grid;gap:13px}.event-time-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.label{font-size:13px;font-weight:800;margin-bottom:6px;display:block}.time-label{display:block;font-size:12px;color:var(--muted);font-weight:700;margin:0 0 5px}.result-count{font-size:12px;color:var(--muted);line-height:1.4}.sheet-status{margin-bottom:10px}.money-wrap{position:relative}.money-wrap .field{padding-right:40px}.currency{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:800}
    .segmented{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;background:var(--panel-2);padding:5px;border-radius:14px}.segmented button{min-height:46px;border:0;border-radius:10px;background:transparent;color:#59616b;font-weight:800}.segmented button.active{background:#fff;color:var(--primary);box-shadow:0 2px 8px rgba(20,30,50,.08)}
    .tabs{display:grid;grid-template-columns:1fr 1fr;gap:7px;background:var(--panel-2);padding:5px;border-radius:14px;margin-bottom:15px}.tabs button{min-height:46px;border:0;border-radius:10px;background:transparent;font-weight:800;color:#59616b}.tabs button.active{background:#fff;color:var(--primary);box-shadow:0 2px 8px rgba(20,30,50,.08)}
    .check-line{display:flex;align-items:center;gap:12px;min-height:54px;border:1px solid var(--line);border-radius:13px;padding:10px 12px;background:#fff}.check-line input{width:22px;height:22px;accent-color:var(--primary)}
    .student-tools{display:grid;grid-template-columns:1fr 145px;gap:8px;margin-bottom:9px}.student-list{border:1px solid var(--line);border-radius:14px;max-height:310px;overflow:auto;background:#fff}.student-item{display:flex;gap:11px;align-items:center;padding:11px 12px;border-bottom:1px solid #edf0f2}.student-item:last-child{border-bottom:0}.student-item input{width:22px;height:22px;accent-color:var(--primary);flex:0 0 auto}.student-item .n{font-weight:750}.student-item .c{font-size:12px;color:var(--muted);margin-top:2px}.student-empty{padding:24px;text-align:center;color:var(--muted)}
    .inline-info{border-radius:13px;padding:11px 12px;background:#eef5ff;color:#275f9a;font-size:13px;line-height:1.45}.inline-warning{border-radius:13px;padding:11px 12px;background:#fff7e6;color:#80540b;font-size:13px;line-height:1.45}.inline-danger{border-radius:13px;padding:11px 12px;background:#fff0f0;color:#982f2f;font-size:13px;line-height:1.45}
    .report-options{display:grid;gap:9px;margin-bottom:14px}.report-preview{border:1px solid var(--line);border-radius:14px;background:#eef0f3;padding:10px;overflow:auto}.print-sheet{background:#fff;width:210mm;min-height:120mm;margin:0 auto;padding:14mm;box-shadow:0 3px 14px rgba(20,30,50,.08);color:#111;font-family:Arial,sans-serif}.print-sheet h1{font-size:20px;margin:0 0 5px;text-align:center}.print-sheet .print-meta{text-align:center;font-size:11px;color:#444;margin-bottom:12px}.print-sheet table{width:100%;border-collapse:collapse;font-size:11px}.print-sheet th,.print-sheet td{border:1px solid #bbb;padding:7px 6px;text-align:left}.print-sheet th{background:#f1f2f4;font-weight:700}.print-sheet .report-summary{display:flex;justify-content:space-between;gap:8px;font-size:11px;margin:8px 0 12px}
    .toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;z-index:300;background:#17202a;color:#fff;border-radius:13px;padding:12px 16px;font-size:14px;max-width:calc(100% - 30px);box-shadow:0 10px 28px rgba(0,0,0,.22);transition:.2s;pointer-events:none;text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}
    .footer{text-align:center;color:var(--muted);font-size:12px;margin:24px 0 8px}.footer strong{color:#4f5964}
    .hide{display:none!important}.danger-zone{margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
    @media(min-width:720px){.app-shell{padding-left:24px;padding-right:24px}.stats-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.modal-backdrop{align-items:center;padding:24px}.modal{border-radius:24px;max-height:88vh}.fabbar{grid-template-columns:1.2fr 1fr}.member-actions{grid-template-columns:repeat(4,max-content);justify-content:end}.member-card{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}.member-actions{margin-top:0}.report-preview{max-height:55vh}}
    @media(max-width:560px){.hero{display:block}.hero-compact .primary-btn{width:100%}.search-row,.student-tools{grid-template-columns:1fr}.print-sheet{width:760px}.detail-menu{display:none}}
    @media print{
      @page{size:A4 portrait;margin:10mm}
      body{background:#fff!important}
      body>*:not(#printRoot){display:none!important}
      #printRoot{display:block!important;position:static!important}
      #printRoot .print-sheet{display:block!important;width:auto!important;min-height:0!important;margin:0!important;padding:0!important;box-shadow:none!important}
      #printRoot .print-sheet h1{font-size:18px}
      #printRoot table{font-size:10px}
      #printRoot th,#printRoot td{padding:5px}
      thead{display:table-header-group}
      tr{page-break-inside:avoid}
    }
  </style>
</head>
<body>
  <div class="app-shell" id="appShell">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <h1>Etkinlik Takip Programı</h1>
          <div class="brand-meta"><span id="connectionDot" class="status-dot"></span><span id="connectionText">Bağlanıyor…</span><span>•</span><span>v1.3</span></div>
        </div>
        <button class="icon-btn" id="settingsBtn" aria-label="Ayarlar" title="Ayarlar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6 1.7 1.7 0 0 0-.4 1.1V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 8.5 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.1 15a1.7 1.7 0 0 0-.6-1 1.7 1.7 0 0 0-1.1-.4H2.3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.1 8.5a1.7 1.7 0 0 0-.34-1.88L3.7 6.56a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 8.5 4.1a1.7 1.7 0 0 0 1-.6 1.7 1.7 0 0 0 .4-1.1V2.3a2 2 0 1 1 4 0v.09A1.7 1.7 0 0 0 15 4.1a1.7 1.7 0 0 0 1.88-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 8.5c.14.38.36.72.66 1 .3.27.69.4 1.1.4h.54a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.1.4c-.3.28-.52.62-.66 1Z"/></svg>
        </button>
      </div>
    </header>

    <main>
      <section id="homeView" class="view active">
        <div class="hero hero-compact">
          <button class="primary-btn" id="newEventBtn">+ Yeni Etkinlik</button>
        </div>
        <div class="section-head"><div><h2>Etkinlikler</h2><div class="sub" id="eventCountText">0 etkinlik</div></div></div>
        <div id="eventList" class="event-list"></div>
      </section>

      <section id="eventView" class="view">
        <div class="detail-head">
          <button class="back-btn" id="backBtn" aria-label="Geri">‹</button>
          <div class="detail-title-wrap">
            <h2 id="detailTitle">Etkinlik</h2>
            <div class="event-meta" id="detailMeta"></div>
          </div>
          <div class="detail-menu"><button class="secondary-btn" id="editEventBtn">Düzenle</button></div>
        </div>

        <div class="stats-grid" id="statsGrid"></div>

        <div class="toolbar">
          <div class="search-row">
            <input id="memberSearch" class="field" type="search" placeholder="Öğrenci ara…" autocomplete="off" />
            <select id="memberClassFilter" class="select"><option value="">Tüm sınıflar</option></select>
          </div>
          <div class="filter-row">
            <select id="paymentFilter" class="select">
              <option value="">Tüm ödemeler</option>
              <option value="paid">Ödendi</option>
              <option value="partial">Eksik ödendi</option>
              <option value="unpaid">Ödenmedi</option>
            </select>
            <select id="permissionFilter" class="select">
              <option value="">Tüm belgeler</option>
              <option value="yes">İzin geldi</option>
              <option value="no">İzin eksik</option>
            </select>
          </div>
        </div>

        <div class="section-head"><div><h2>Katılımcılar</h2><div class="sub" id="visibleMemberCount">0 kişi</div></div></div>
        <div id="memberList" class="member-list"></div>

        <div class="fabbar">
          <button class="primary-btn" id="addMemberBtn">+ Üye Ekle</button>
          <button class="secondary-btn" id="reportBtn">Rapor / Yazdır</button>
        </div>
      </section>
    </main>

    <div class="footer"><strong>Kodlayan: Ferhat Karagöz</strong> • Etkinlik Takip Programı v1.3</div>
  </div>

  <div id="modalBackdrop" class="modal-backdrop" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal" id="modalBox">
      <div class="modal-head"><h3 id="modalTitle">Pencere</h3><button class="modal-close" id="modalClose" aria-label="Kapat">×</button></div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-foot" id="modalFoot"></div>
    </div>
  </div>

  <div id="toast" class="toast"></div>
  <div id="printRoot" class="hide"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
    import { getAnalytics, isSupported as analyticsIsSupported } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-analytics.js";
    import { getDatabase, ref, onValue, push, set, update, remove, serverTimestamp, get } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

    const APP_VERSION = "1.3";
    const APP_ROOT = "etkinliktakip";
    const DEFAULT_SHEET_URL = "https://docs.google.com/spreadsheets/d/1OeDI5rQvWXP6s5OhgRFrh1dThnBMmA9mrCjgYuk1Qtw/edit?usp=sharing";
    const DEFAULT_SHEET_NAME = "Ogrenciler";

    const firebaseConfig = {
      apiKey: "AIzaSyBABt0TN-k_ALfHyDv0yGzOiZMhACxfJbU",
      authDomain: "odeme-37f3e.firebaseapp.com",
      databaseURL: "https://odeme-37f3e-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "odeme-37f3e",
      storageBucket: "odeme-37f3e.firebasestorage.app",
      messagingSenderId: "433986287426",
      appId: "1:433986287426:web:264fe3aa9fabcc09103adb",
      measurementId: "G-QFHTWMBGZ9"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    analyticsIsSupported().then(ok => { if (ok) { try { getAnalytics(app); } catch (_) {} } }).catch(() => {});

    const $ = (id) => document.getElementById(id);
    const state = {
      events: {},
      currentEventId: null,
      students: [],
      studentsLoadedAt: 0,
      sheetUrl: DEFAULT_SHEET_URL,
      settings: {},
      memberFilters: { q:"", className:"", payment:"", permission:"" }
    };

    const trCollator = new Intl.Collator("tr", { sensitivity:"base", numeric:true });
    const moneyFmt = new Intl.NumberFormat("tr-TR", { style:"currency", currency:"TRY", minimumFractionDigits:0, maximumFractionDigits:2 });
    const numFmt = new Intl.NumberFormat("tr-TR", { minimumFractionDigits:0, maximumFractionDigits:2 });
    const esc = (v="") => String(v).replace(/[&<>'"]/g, s => ({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[s]));
    const normalize = (v="") => String(v).trim().normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLocaleUpperCase("tr-TR").replace(/[^A-Z0-9ÇĞİÖŞÜ]/g,"");
    const numeric = (v) => {
      if (typeof v === "number") return Number.isFinite(v) ? v : 0;
      const s = String(v ?? "").trim().replace(/\s/g,"").replace(/\.(?=\d{3}(?:\D|$))/g,"").replace(",", ".");
      const n = Number(s); return Number.isFinite(n) ? n : 0;
    };
    const clampMoney = (n) => Math.max(0, Math.round((numeric(n)+Number.EPSILON)*100)/100);
    const currency = (n) => moneyFmt.format(clampMoney(n));
    const todayInputValue = () => {
      const d = new Date(), pad = n => String(n).padStart(2,"0");
      return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
    };
    const eventScheduleParts = (event={}) => {
      const legacy = String(event.eventAt || "");
      return {
        date: String(event.eventDate || legacy.slice(0,10) || ""),
        startTime: String(event.startTime || legacy.slice(11,16) || ""),
        endTime: String(event.endTime || "")
      };
    };
    const formatEventDate = (dateValue) => {
      if (!dateValue) return "Tarih belirtilmedi";
      const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(dateValue);
      if (!m) return dateValue;
      const d = new Date(Number(m[1]), Number(m[2])-1, Number(m[3]));
      return new Intl.DateTimeFormat("tr-TR", { day:"2-digit", month:"long", year:"numeric" }).format(d);
    };
    const formatEventSchedule = (event={}) => {
      const {date,startTime,endTime} = eventScheduleParts(event);
      const dateText = formatEventDate(date);
      if (startTime && endTime) return `${dateText} • ${startTime}–${endTime}`;
      if (startTime) return `${dateText} • ${startTime}`;
      return dateText;
    };
    const eventStartTimestamp = (event={}) => {
      const {date,startTime} = eventScheduleParts(event);
      if (!date) return 0;
      const d = new Date(`${date}T${startTime || "00:00"}`);
      return Number.isNaN(d.getTime()) ? 0 : d.getTime();
    };
    const paymentState = (member, fee) => {
      const paid = clampMoney(member?.paidAmount || 0), total = clampMoney(fee || 0);
      if (total <= 0 || paid >= total - 0.005) return "paid";
      if (paid > 0) return "partial";
      return "unpaid";
    };
    const debt = (member, fee) => Math.max(0, clampMoney(fee) - clampMoney(member?.paidAmount || 0));
    const memberEntries = (event) => Object.entries(event?.members || {}).map(([id,m]) => ({id,...m}));

    function toast(message){
      const el=$("toast"); el.textContent=message; el.classList.add("show");
      clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove("show"),2400);
    }
    function setConnection(online){

      const collected=members.reduce((s,m)=>s+Math.min(clampMoney(m.paidAmount||0),fee),0);

    function renderMembers(all,event){
      const f=state.memberFilters, fee=clampMoney(event.fee||0);
      const q=normalize(f.q);
      const filtered=all.filter(m=>{
        const ps=paymentState(m,fee);

        if(f.className && String(m.className||"")!==f.className) return false;
        if(f.payment && ps!==f.payment) return false;
        if(f.permission==="yes" && m.permissionReceived!==true) return false;
        if(f.permission==="no" && m.permissionReceived===true) return false;

    async function ensureStudentsLoaded(force=false){
      const status=$("sheetStatus"); if(status){ status.className="sheet-status inline-info"; status.textContent="E-tablo okunuyor…"; }
      if(!force && state.students.length && Date.now()-state.studentsLoadedAt<5*60*1000) return state.students;
      try{
        const rows=await fetchSheetRows(state.sheetUrl);
        const students=extractStudents(rows);
        if(!students.length) throw new Error("ADSOYAD / SINIF sütunları veya öğrenci verisi bulunamadı.");
        state.students=students;state.studentsLoadedAt=Date.now();
        return students;
      }catch(err){
        console.error(err);
        if(status){status.className="inline-danger";status.innerHTML=`E-tablo okunamadı. Dosyanın <strong>bağlantıya sahip herkes tarafından görüntülenebilir</strong> olduğundan ve <strong>Ogrenciler</strong> adlı sayfada ilk satırda <strong>ADSOYAD</strong> ile <strong>SINIF</strong> başlıklarının bulunduğundan emin olun.<br><br><small>${esc(err.message||err)}</small>`;}
        throw err;
      }
    }
    function sheetParts(url){
      const id=String(url).match(/\/spreadsheets\/d\/([a-zA-Z0-9_-]+)/)?.[1];
      if(!id) throw new Error("Geçerli Google E-Tablolar bağlantısı değil.");
      let gid=""; try{gid=new URL(url).searchParams.get("gid")||"";}catch(_){ }
      return {id,gid};
    }
    async function fetchSheetRows(url){
      const {id,gid}=sheetParts(url);
      const sheet=encodeURIComponent(DEFAULT_SHEET_NAME);
      const urls=[
        `https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:csv&sheet=${sheet}`,
        `https://docs.google.com/spreadsheets/d/${id}/export?format=csv&sheet=${sheet}`,
        ...(gid?[`https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:csv&gid=${encodeURIComponent(gid)}`]:[])
      ];
      let lastErr;
      for(const u of urls){
        try{
          const res=await fetch(u,{cache:"no-store",credentials:"omit"});
          if(!res.ok) throw new Error(`HTTP ${res.status}`);
          const text=await res.text();
          if(!text || /<html/i.test(text.slice(0,300))) throw new Error("CSV yerine oturum sayfası döndü.");
          const rows=parseCSV(text);
          if(!rows?.length) throw new Error(`'${DEFAULT_SHEET_NAME}' sayfası boş veya okunamadı.`);
          return rows;
        }catch(e){lastErr=e;}
      }
      throw new Error(`'${DEFAULT_SHEET_NAME}' sayfası okunamadı. ${lastErr?.message||"E-tablo indirilemedi."}`);
    }
    function parseCSV(text){
      const rows=[];let row=[],field="",quoted=false;
      for(let i=0;i<text.length;i++){
        const c=text[i],n=text[i+1];
        if(quoted){if(c==='"'&&n==='"'){field+='"';i++;}else if(c==='"'){quoted=false;}else{field+=c;}}
        else{if(c==='"')quoted=true;else if(c===','){row.push(field);field="";}else if(c==='\n'){row.push(field);rows.push(row);row=[];field="";}else if(c!=='\r'){field+=c;}}
      }
      row.push(field); if(row.some(v=>v!=="")) rows.push(row); return rows;
    }
    function extractStudents(rows){
      if(!rows?.length)return[];
      const headers=rows[0].map(normalize);
      const nameIdx=headers.findIndex(h=>["ADSOYAD","ADISOYADI","OGRENCIADSOYAD","OGRENCI"].includes(h));
      const classIdx=headers.findIndex(h=>["SINIF","SINIFI","SUBE","SINIFSUBE"].includes(h));
      if(nameIdx<0||classIdx<0) throw new Error(`Başlıklar bulunamadı. Okunan başlıklar: ${rows[0].join(", ")}`);
      const out=[];
      for(let i=1;i<rows.length;i++){
        const name=String(rows[i][nameIdx]||"").trim(), className=String(rows[i][classIdx]||"").trim();
        if(!name)continue;
        out.push({row:i+1,name,className,signature:`${normalize(name)}|${normalize(className)}`});
      }
      return out.sort((a,b)=>trCollator.compare(a.className,b.className)||trCollator.compare(a.name,b.name));
    }
    function renderStudentPicker(local){
      const controls=$("studentControls"), status=$("sheetStatus"); if(!controls||!status)return;
      status.className="sheet-status hide";status.textContent="";
      controls.classList.remove("hide");
      const classes=[...new Set(state.students.map(s=>s.className).filter(Boolean))].sort(trCollator.compare);
      $("studentClass").innerHTML=`<option value="">Tüm sınıflar</option>`+classes.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join("");
      $("studentSearch").oninput=()=>renderStudentRows(local);
      $("studentClass").onchange=()=>renderStudentRows(local);
      $("selectVisibleStudents").onclick=()=>{
        $("studentList").querySelectorAll('input[type="checkbox"]:not(:disabled)').forEach(x=>local.selectedSignatures.add(x.dataset.signature));
        renderStudentRows(local);
      };
      renderStudentRows(local);
    }
    function renderStudentRows(local){
      const list=$("studentList"); if(!list)return;
      const q=normalize($("studentSearch")?.value||""), c=$("studentClass")?.value||"";
      const ev=getCurrentEvent();
      const existing=new Set(memberEntries(ev).filter(m=>m.source==="sheet").map(m=>m.sourceSignature).filter(Boolean));
      local?.addedSignatures?.forEach(sig=>existing.add(sig));
      const rows=state.students.filter(s=>(!q||normalize(`${s.name} ${s.className}`).includes(q))&&(!c||s.className===c));
      const selectedCount=local?.selectedSignatures?.size||0;
      $("studentResultCount").textContent=`${rows.length} öğrenci • ${selectedCount} seçili`;
      if(!rows.length){list.innerHTML=`<div class="student-empty">Sonuç yok</div>`;return;}
      list.innerHTML=rows.map(s=>{
        const exists=existing.has(s.signature);
        const checked=!exists&&local?.selectedSignatures?.has(s.signature);
        return `<label class="student-item"><input type="checkbox" data-signature="${esc(s.signature)}" ${checked?"checked":""} ${exists?"disabled":""}><span><div class="n">${esc(s.name)}</div><div class="c">${esc(s.className||"Sınıf yok")}${exists?" • Bu etkinliğe ekli":""}</div></span></label>`;
      }).join("");
      list.querySelectorAll('input[type="checkbox"]:not(:disabled)').forEach(x=>x.addEventListener("change",()=>{
        if(x.checked)local.selectedSignatures.add(x.dataset.signature);else local.selectedSignatures.delete(x.dataset.signature);
        $("studentResultCount").textContent=`${rows.length} öğrenci • ${local.selectedSignatures.size} seçili`;
      }));
    }
    async function saveMemberFromModal(local){
      const event=getCurrentEvent();if(!event)return;
      const fee=clampMoney(event.fee||0), permissionReceived=$("permissionCheck").checked;
      let paidAmount=0;
      if(local.pay==="paid") paidAmount=fee;
      if(local.pay==="partial"){
        paidAmount=clampMoney($("partialAmount").value);
        if(paidAmount<=0||paidAmount>=fee){toast(fee>0?"Eksik ödeme, 0 TL'den büyük ve etkinlik ücretinden küçük olmalıdır.":"Ücretsiz etkinlikte eksik ödeme kullanılamaz.");return;}
      }
      let people=[];
      if(local.mode==="manual"){
        const name=$("manualName").value.trim();if(!name){toast("Ad soyad girin.");return;}
        people=[{name,className:"",source:"manual",sourceSignature:""}];
      }else{
        const sigs=[...(local.selectedSignatures||[])];
        if(!sigs.length){toast("En az bir öğrenci seçin.");return;}
        const currentExisting=new Set(memberEntries(getCurrentEvent()).filter(m=>m.source==="sheet").map(m=>m.sourceSignature).filter(Boolean));
        local.addedSignatures.forEach(sig=>currentExisting.add(sig));
        const setS=new Set(sigs.filter(sig=>!currentExisting.has(sig)));
        people=state.students.filter(s=>setS.has(s.signature)).map(s=>({name:s.name,className:s.className,source:"sheet",sourceSignature:s.signature}));
        if(!people.length){local.selectedSignatures.clear();renderStudentRows(local);toast("Seçilen öğrenciler zaten etkinliğe ekli.");return;}
      }
      try{
        $("saveMemberBtn").disabled=true;
        const updates={};
        for(const p of people){
          const id=push(ref(db,`${APP_ROOT}/events/${state.currentEventId}/members`)).key;
          updates[`${APP_ROOT}/events/${state.currentEventId}/members/${id}`]={...p,paidAmount,permissionReceived,createdAt:Date.now(),updatedAt:Date.now()};
        }
        await update(ref(db),updates);
        $("saveMemberBtn").disabled=false;
        if(local.mode==="manual"){
          $("manualName").value="";
          $("manualName").focus();
        }else{
          people.forEach(p=>{if(p.sourceSignature)local.addedSignatures.add(p.sourceSignature);});
          local.selectedSignatures.clear();
          renderStudentRows(local);
          $("studentSearch")?.focus();
        }
        toast(people.length===1?"Katılımcı eklendi.":`${people.length} katılımcı eklendi.`);
      }catch(err){console.error(err);toast("Katılımcı kaydedilemedi.");$("saveMemberBtn").disabled=false;}
    }

    function openPaymentModal(memberId){
      const event=getCurrentEvent(),m=event?.members?.[memberId];if(!m)return;
      const bal=debt(m,event.fee);
      openModal("Ödeme Al",`<div class="form-grid"><div class="inline-info"><strong>${esc(m.name)}</strong><br>Kalan borç: <strong>${esc(currency(bal))}</strong></div><div><label class="label" for="paymentAmount">Alınan ödeme</label><div class="money-wrap"><input id="paymentAmount" class="field" type="number" min="0.01" max="${bal}" step="0.01" inputmode="decimal" value="${bal}"><span class="currency">₺</span></div></div><button class="secondary-btn full" id="fullPaymentBtn" type="button">Kalan Borcun Tamamını Al</button></div>`,`<button class="secondary-btn" id="cancelModalBtn">Vazgeç</button><button class="primary-btn" id="savePaymentBtn">Ödemeyi Kaydet</button>`);
      $("cancelModalBtn").onclick=closeModal;$("fullPaymentBtn").onclick=()=>$("paymentAmount").value=bal;$("savePaymentBtn").onclick=()=>savePayment(memberId);
    }
    async function savePayment(memberId){
      const event=getCurrentEvent(),m=event?.members?.[memberId];if(!m)return;
      const bal=debt(m,event.fee),amount=clampMoney($("paymentAmount").value);
      if(amount<=0){toast("Ödeme tutarını girin.");return;} if(amount>bal+0.005){toast(`En fazla ${currency(bal)} alınabilir.`);return;}
      try{await update(ref(db,`${APP_ROOT}/events/${state.currentEventId}/members/${memberId}`),{paidAmount:clampMoney((m.paidAmount||0)+amount),updatedAt:serverTimestamp()});closeModal();toast("Ödeme kaydedildi.");}catch(e){console.error(e);toast("Ödeme kaydedilemedi.");}
    }
    async function markPermissionReceived(memberId){
      try{await update(ref(db,`${APP_ROOT}/events/${state.currentEventId}/members/${memberId}`),{permissionReceived:true,updatedAt:serverTimestamp()});toast("İzin belgesi alındı olarak işaretlendi.");}catch(e){console.error(e);toast("Belge durumu güncellenemedi.");}
    }
    function openEditMemberModal(memberId){
      const event=getCurrentEvent(),m=event?.members?.[memberId];if(!m)return;
      openModal("Katılımcıyı Düzenle",`<div class="form-grid"><div><label class="label">Ad Soyad</label><input id="editMemberName" class="field" value="${esc(m.name||"")}"></div><div><label class="label">Sınıf</label><input id="editMemberClass" class="field" value="${esc(m.className||"")}" placeholder="Elle eklenenlerde boş kalabilir"></div><div><label class="label">Toplam ödenen</label><div class="money-wrap"><input id="editPaidAmount" class="field" type="number" min="0" max="${clampMoney(event.fee||0)}" step="0.01" value="${clampMoney(m.paidAmount||0)}"><span class="currency">₺</span></div></div><label class="check-line"><input id="editPermission" type="checkbox" ${m.permissionReceived?"checked":""}><span><strong>İzin belgesi geldi</strong></span></label></div>`,`<button class="secondary-btn" id="cancelModalBtn">Vazgeç</button><button class="primary-btn" id="saveMemberEditBtn">Güncelle</button>`);
      $("cancelModalBtn").onclick=closeModal;$("saveMemberEditBtn").onclick=()=>saveMemberEdit(memberId);
    }
    async function saveMemberEdit(memberId){
      const event=getCurrentEvent();if(!event)return;
      const name=$("editMemberName").value.trim(),className=$("editMemberClass").value.trim(),paidAmount=clampMoney($("editPaidAmount").value),permissionReceived=$("editPermission").checked,fee=clampMoney(event.fee||0);
      if(!name){toast("Ad soyad boş bırakılamaz.");return;} if(paidAmount>fee+0.005){toast(`Ödenen tutar ${currency(fee)} değerini geçemez.`);return;}
      try{await update(ref(db,`${APP_ROOT}/events/${state.currentEventId}/members/${memberId}`),{name,className,paidAmount,permissionReceived,updatedAt:serverTimestamp()});closeModal();toast("Katılımcı güncellendi.");}catch(e){console.error(e);toast("Katılımcı güncellenemedi.");}
    }
    async function deleteMember(memberId){
      const event=getCurrentEvent(),m=event?.members?.[memberId];if(!m)return;
      if(!confirm(`“${m.name}” bu etkinlikten silinsin mi?`))return;
      try{await remove(ref(db,`${APP_ROOT}/events/${state.currentEventId}/members/${memberId}`));toast("Katılımcı silindi.");}catch(e){console.error(e);toast("Katılımcı silinemedi.");}
    }

    function openReportModal(){
      const event=getCurrentEvent();if(!event)return;
      openModal("Rapor / Yazdır",`<div class="report-options">
        <label class="check-line"><input type="checkbox" id="repClass" checked><span><strong>Sınıf bilgisi</strong></span></label>
        <label class="check-line"><input type="checkbox" id="repPayment"><span><strong>Ödeme durumu</strong></span></label>
        <label class="check-line"><input type="checkbox" id="repAmounts"><span><strong>Ödenen tutar ve kalan borç</strong></span></label>
        <label class="check-line"><input type="checkbox" id="repPermission"><span><strong>İzin belgesi durumu</strong></span></label>
        <label class="check-line"><input type="checkbox" id="repSummary" checked><span><strong>Üst özet bilgileri</strong></span></label>
      </div><div class="report-preview"><div id="reportPreviewMount"></div></div>`,`<button class="secondary-btn" id="cancelModalBtn">Kapat</button><button class="primary-btn" id="printBtn">Yazdır</button>`);
      $("cancelModalBtn").onclick=closeModal;
      ["repClass","repPayment","repAmounts","repPermission","repSummary"].forEach(id=>$(id).onchange=updateReportPreview);
      $("printBtn").onclick=printReport;updateReportPreview();
    }
    function reportOptions(){return{showClass:$("repClass")?.checked??true,showPayment:$("repPayment")?.checked??false,showAmounts:$("repAmounts")?.checked??false,showPermission:$("repPermission")?.checked??false,showSummary:$("repSummary")?.checked??true};}
    function buildReportHTML(options){
      const event=getCurrentEvent();if(!event)return"";
      const fee=clampMoney(event.fee||0);
      const members=memberEntries(event).sort((a,b)=>trCollator.compare(a.className||"",b.className||"")||trCollator.compare(a.name||"",b.name||""));
      const totalPaid=members.reduce((s,m)=>s+Math.min(clampMoney(m.paidAmount||0),fee),0);
      const totalDebt=Math.max(0,fee*members.length-totalPaid);
      const permissions=members.filter(m=>m.permissionReceived===true).length;
      const heads=["No","Ad Soyad"];if(options.showClass)heads.push("Sınıf");if(options.showPayment)heads.push("Ödeme Durumu");if(options.showAmounts){heads.push("Ödenen");heads.push("Kalan Borç");}if(options.showPermission)heads.push("İzin Belgesi");
      const rows=members.map((m,i)=>{const ps=paymentState(m,fee);const cells=[i+1,esc(m.name||"")];if(options.showClass)cells.push(esc(m.className||"—"));if(options.showPayment)cells.push(ps==="paid"?"Ödendi":ps==="partial"?"Eksik ödendi":"Ödenmedi");if(options.showAmounts){cells.push(esc(currency(Math.min(clampMoney(m.paidAmount||0),fee))));cells.push(esc(currency(debt(m,fee))));}if(options.showPermission)cells.push(m.permissionReceived?"Geldi":"Eksik");return `<tr>${cells.map(c=>`<td>${c}</td>`).join("")}</tr>`;}).join("");
      return `<div class="print-sheet"><h1>${esc(event.name||"Etkinlik Katılımcı Listesi")}</h1><div class="print-meta">${esc(formatEventSchedule(event))} • Etkinlik Ücreti: ${esc(currency(fee))}</div>${options.showSummary?`<div class="report-summary"><span><strong>Katılımcı:</strong> ${members.length}</span><span><strong>İzin geldi:</strong> ${permissions}</span>${options.showAmounts?`<span><strong>Toplanan:</strong> ${esc(currency(totalPaid))}</span><span><strong>Kalan:</strong> ${esc(currency(totalDebt))}</span>`:""}</div>`:""}<table><thead><tr>${heads.map(h=>`<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${rows||`<tr><td colspan="${heads.length}" style="text-align:center;padding:18px">Katılımcı bulunmuyor.</td></tr>`}</tbody></table></div>`;
    }
    function updateReportPreview(){const mount=$("reportPreviewMount");if(mount)mount.innerHTML=buildReportHTML(reportOptions());}
    function printReport(){
      const root=$("printRoot");root.innerHTML=buildReportHTML(reportOptions());root.classList.remove("hide");
      setTimeout(()=>{window.print();setTimeout(()=>{root.classList.add("hide");root.innerHTML="";},500);},80);
    }

    function openSettings(){
      openModal("Ayarlar",`<div class="form-grid"><div><label class="label" for="sheetUrlInput">Öğrenci e-tablo bağlantısı</label><textarea id="sheetUrlInput" class="field" style="height:100px;padding:12px;resize:vertical">${esc(state.sheetUrl)}</textarea></div><button class="secondary-btn full" id="testSheetBtn">E-Tabloyu Test Et / Yenile</button><div id="settingsSheetStatus"></div><div class="danger-zone"><div class="inline-danger"><strong>Veritabanını sıfırla</strong><br>Tüm kayıtlar kalıcı olarak silinir.</div><button class="danger-btn full" id="resetDbBtn" style="margin-top:10px">Veritabanını Sıfırla</button></div></div>`,`<button class="secondary-btn" id="cancelModalBtn">Kapat</button><button class="primary-btn" id="saveSettingsBtn">Ayarları Kaydet</button>`);
      $("cancelModalBtn").onclick=closeModal;$("saveSettingsBtn").onclick=saveSettings;$("testSheetBtn").onclick=testSheet;$("resetDbBtn").onclick=openResetConfirm;
    }
    async function testSheet(){
      const url=$("sheetUrlInput").value.trim(),status=$("settingsSheetStatus");status.className="inline-info";status.textContent="E-tablo test ediliyor…";
      try{const rows=await fetchSheetRows(url);const students=extractStudents(rows);status.className="inline-info";status.textContent=`Bağlantı başarılı. ${DEFAULT_SHEET_NAME} sayfasında ${students.length} öğrenci bulundu.`;state.students=students;state.studentsLoadedAt=Date.now();}catch(e){status.className="inline-danger";status.textContent=`Bağlantı başarısız: ${e.message||e}`;}
    }
    async function saveSettings(){
      const sheetUrl=$("sheetUrlInput").value.trim();try{sheetParts(sheetUrl);}catch(e){toast(e.message);return;}
      try{await update(ref(db,`${APP_ROOT}/settings`),{sheetUrl,updatedAt:serverTimestamp(),appVersion:APP_VERSION});state.sheetUrl=sheetUrl;state.students=[];state.studentsLoadedAt=0;closeModal();toast("Ayarlar kaydedildi.");}catch(e){console.error(e);toast("Ayarlar kaydedilemedi.");}
    }
    function openResetConfirm(){
      openModal("Veritabanını Sıfırla",`<div class="form-grid"><div class="inline-danger">Bu işlem geri alınamaz.</div><div><label class="label" for="resetConfirmInput">Onaylamak için SIFIRLA yazın</label><input id="resetConfirmInput" class="field" autocomplete="off" placeholder="SIFIRLA"></div></div>`,`<button class="secondary-btn" id="cancelModalBtn">Vazgeç</button><button class="danger-btn" id="confirmResetBtn">Kalıcı Olarak Sıfırla</button>`);
      $("cancelModalBtn").onclick=closeModal;$("confirmResetBtn").onclick=resetDatabase;
    }
    async function resetDatabase(){
      if(normalize($("resetConfirmInput").value)!=="SIFIRLA"){toast("Onay alanına SIFIRLA yazın.");return;}
      try{$("confirmResetBtn").disabled=true;await remove(ref(db,APP_ROOT));state.students=[];state.studentsLoadedAt=0;state.sheetUrl=DEFAULT_SHEET_URL;closeModal();navigateHome();toast("Veritabanı sıfırlandı.");}catch(e){console.error(e);toast("Veritabanı sıfırlanamadı.");$("confirmResetBtn").disabled=false;}
    }

    $("newEventBtn").addEventListener("click",openNewEvent);
    $("settingsBtn").addEventListener("click",openSettings);
    $("backBtn").addEventListener("click",()=>history.length>1?history.back():navigateHome());
    $("editEventBtn").addEventListener("click",openEditEvent);
    $("addMemberBtn").addEventListener("click",openAddMemberModal);
    $("reportBtn").addEventListener("click",openReportModal);
    $("memberSearch").addEventListener("input",e=>{state.memberFilters.q=e.target.value;renderEvent();});
    $("memberClassFilter").addEventListener("change",e=>{state.memberFilters.className=e.target.value;renderEvent();});
    $("paymentFilter").addEventListener("change",e=>{state.memberFilters.payment=e.target.value;renderEvent();});
    $("permissionFilter").addEventListener("change",e=>{state.memberFilters.permission=e.target.value;renderEvent();});

    handleHash();
  </script>
</body>
</html>
